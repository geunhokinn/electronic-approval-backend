spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  ai:
    bedrock:
      aws:
        region: ${LOCAL_AWS_REGION}
      converse:
        chat:
          options:
            model: ${LOCAL_BEDROCK_CHAT_MODEL_ID}
      titan:
        embedding:
          model: ${LOCAL_BEDROCK_EMBEDDING_MODEL_ID}

admin:
  username: ${LOCAL_ADMIN_USERNAME}
  password: ${LOCAL_ADMIN_PASSWORD}
  name: ${LOCAL_ADMIN_NAME}
  headquarters: ${LOCAL_ADMIN_HEADQUARTERS}
  team: ${LOCAL_ADMIN_TEAM}
  position: ${LOCAL_ADMIN_POSITION}

aws:
  region: ${LOCAL_AWS_REGION}
  s3:
    attachment-bucket: ${LOCAL_S3_ATTACHMENT_BUCKET}

qdrant:
  host: ${LOCAL_QDRANT_HOST}
  port: ${LOCAL_QDRANT_PORT}
  collection: ${LOCAL_QDRANT_COLLECTION}

ai:
  bedrock:
    region: ${LOCAL_AWS_REGION}
    chat-model: ${LOCAL_BEDROCK_CHAT_MODEL_ID}
    embedding-model: ${LOCAL_BEDROCK_EMBEDDING_MODEL_ID}
