services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eapproval-qdrant
    restart: unless-stopped

    volumes:
      - qdrant_prod_data:/qdrant/storage

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Docker 내부 네트워크를 사용하므로 외부 포트는 열지 않는다.
    #    ports:
    #      - "3306:3306"

  server:
    image: ${SERVER_IMAGE}
    container_name: eapproval-server
    restart: unless-stopped

    #  Nginx가 Docker 내부 네트워크를 통해 접근하므로 외부 포트는 열지 않는다.
    #    ports:
    #      - "8080:8080"

    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul

      SPRING_PROFILES_ACTIVE: prodEnv

      PROD_DB_URL: ${PROD_DB_URL}
      PROD_DB_USERNAME: ${PROD_DB_USERNAME}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD}

      PROD_ADMIN_USERNAME: ${PROD_ADMIN_USERNAME}
      PROD_ADMIN_PASSWORD: ${PROD_ADMIN_PASSWORD}
      PROD_ADMIN_NAME: ${PROD_ADMIN_NAME}
      PROD_ADMIN_HEADQUARTERS: ${PROD_ADMIN_HEADQUARTERS}
      PROD_ADMIN_TEAM: ${PROD_ADMIN_TEAM}
      PROD_ADMIN_POSITION: ${PROD_ADMIN_POSITION}

      PROD_AWS_REGION: ${PROD_AWS_REGION}
      PROD_S3_ATTACHMENT_BUCKET: ${PROD_S3_ATTACHMENT_BUCKET}
      PROD_S3_REGULATION_BUCKET: ${PROD_S3_REGULATION_BUCKET}

      PROD_BEDROCK_CHAT_MODEL_ID: ${PROD_BEDROCK_CHAT_MODEL_ID}
      PROD_BEDROCK_EMBEDDING_MODEL_ID: ${PROD_BEDROCK_EMBEDDING_MODEL_ID}

      QDRANT_HOST: ${PROD_QDRANT_HOST}
      QDRANT_PORT: ${PROD_QDRANT_PORT}
      QDRANT_COLLECTION: ${PROD_QDRANT_COLLECTION}

    depends_on:
      - qdrant

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: eapproval-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

    depends_on:
      - server

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    container_name: eapproval-certbot

    profiles:
      - certificate

    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  qdrant_prod_data:
