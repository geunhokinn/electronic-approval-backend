services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eapproval-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_local_data:/qdrant/storage

  mariadb:
    image: mariadb:11.4
    container_name: eapproval-mariadb
    restart: unless-stopped

    environment:
      TZ: Asia/Seoul

      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${LOCAL_DB_NAME}
      MARIADB_USER: ${LOCAL_DB_USERNAME}
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mariadb_local_data:/var/lib/mysql

volumes:
  mariadb_local_data:
  qdrant_local_data:
