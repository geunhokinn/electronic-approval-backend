server {
    listen 80;

    server_name api.eapproval.hokinn.com;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name api.eapproval.hokinn.com;

    server_tokens off;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/api.eapproval.hokinn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eapproval.hokinn.com/privkey.pem;

    # SSE 스트리밍 응답은 이벤트를 즉시 전달하도록 프록시 버퍼링을 비활성화합니다.
    location = /api/chat/messages/stream {
        proxy_pass http://server:8080;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://server:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
